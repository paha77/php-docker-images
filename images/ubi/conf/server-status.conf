ExtendedStatus on

Listen 8081
<VirtualHost *:8081>
    DocumentRoot /opt/app-root/status

    <Location /status/apache>
        SetHandler server-status
    </Location>

    Alias /metrics /opt/app-root/status/metrics.php
</VirtualHost>

<Directory /opt/app-root/status>
    Require all granted
</Directory>

Alias /status/health /opt/app-root/status/health.php
