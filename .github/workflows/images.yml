name: PHP images
on:
  pull_request:
  push:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: php-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  matrix:
    name: Configure image matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          branches=$(jq -cn --args '$ARGS.positional' "${PHP_BRANCHES[@]}")
          echo "platforms=$(jq -cn --argjson branch "$branches" '{branch: $branch, arch: ["amd64", "arm64"]}')" >> "$GITHUB_OUTPUT"
  build:
    name: Build PHP ${{ matrix.branch }} ${{ matrix.kind }} (${{ matrix.arch }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.matrix.outputs.platforms).branch }}
        arch: ${{ fromJSON(needs.matrix.outputs.platforms).arch }}
        kind: [cli, ubi]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: Build and validate image
        run: bash scripts/build.sh '${{ matrix.kind }}' '${{ matrix.branch }}' '${{ matrix.arch }}'
      - name: Save validated image
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          docker save 'local/php-${{ matrix.kind }}:${{ matrix.branch }}-${{ matrix.arch }}' | gzip -1 > 'image-artifacts/${{ matrix.kind }}-${{ matrix.branch }}-${{ matrix.arch }}.tar.gz'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.kind }}-${{ matrix.branch }}-${{ matrix.arch }}
          path: image-artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  dev:
    name: Build PHP ${{ matrix.branch }} dev (${{ matrix.arch }})
    needs: [matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-ubi-${{ matrix.branch }}-${{ matrix.arch }}
          path: image-artifacts
      - name: Load this run's validated UBI parent
        run: docker load --input 'image-artifacts/ubi-${{ matrix.branch }}-${{ matrix.arch }}.tar.gz'
      - name: Build and validate dev image
        run: bash scripts/build.sh dev '${{ matrix.branch }}' '${{ matrix.arch }}'
      - name: Save validated dev image
        run: |
          set -euo pipefail
          docker save 'local/php-dev:${{ matrix.branch }}-${{ matrix.arch }}' | gzip -1 > 'image-artifacts/dev-${{ matrix.branch }}-${{ matrix.arch }}.tar.gz'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-dev-${{ matrix.branch }}-${{ matrix.arch }}
          path: image-artifacts/dev-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  publish:
    name: Docker push
    needs: [build, dev]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: image-artifacts
      - name: Load every validated image before registry login
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          for branch in "${PHP_BRANCHES[@]}"; do
            for kind in cli ubi dev; do
              for arch in amd64 arm64; do
                docker load --input "image-artifacts/$kind-$branch-$arch.tar.gz"
                docker image inspect "local/php-$kind:$branch-$arch" >/dev/null
              done
            done
          done
      - name: Authenticate and publish validated images
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'paha77' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          trap 'docker logout >/dev/null 2>&1' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          bash scripts/publish.sh
